[env:mik32v2]
platform = MIK32
board = development-board
framework = framework-mik32v2-sdk
board_build.ldscript = spifi
upload_protocol = custom
upload_command = $PYTHONEXE ${platformio.packages_dir}/tool-mik32-uploader/mik32_upload.py $BUILD_DIR/${PROGNAME}.hex --run-openocd --openocd-exec ${platformio.packages_dir}/tool-openocd/bin/openocd --openocd-scripts ${platformio.packages_dir}/tool-openocd/openocd/scripts --openocd-interface ${platformio.packages_dir}/tool-mik32-uploader/openocd-scripts/interface/ch347.cfg --openocd-target ${platformio.packages_dir}/tool-mik32-uploader/openocd-scripts/target/mik32.cfg --adapter-speed 2000 --post-action halt
board_upload.maximum_size = 524288
monitor_speed = 9600

build_flags =
    -DTF_LITE_USE_GLOBAL_CMATH_FUNCTIONS
    -DTF_LITE_USE_GLOBAL_MAX
    -DTF_LITE_USE_GLOBAL_MIN
    -I lib/tflite_micro
    -I lib/tflite_micro/third_party
    -I lib/tflite_micro/third_party/flatbuffers/include
    -I lib/tflite_micro/third_party/gemmlowp
    -I lib/tflite_micro/third_party/ruy
    -Wl,--defsym,__stack_size=2048
    -msmall-data-limit=0
